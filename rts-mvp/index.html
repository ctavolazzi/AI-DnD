<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>RTS MVP</title>
<style>
  body {
    margin: 0; padding: 18px; background: #15161a; color: #d8d8dc;
    font: 13px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace;
    display: flex; flex-direction: column; align-items: center; gap: 10px;
  }
  canvas { background: #1e2129; border: 1px solid #33363f; cursor: crosshair; }
  #hud { display: flex; gap: 22px; letter-spacing: .04em; }
  #hint { opacity: .5; text-align: center; }
  b { color: #f2c14e; font-weight: 600; }
</style>
</head>
<body>

<div id="hud"></div>
<canvas id="c" width="640" height="480"></canvas>
<div id="hint"><!-- filled from the balance constants so the costs cannot drift --></div>

<script>
// ---- balance ---------------------------------------------------------------
// These are the only numbers that define difficulty. They are `const` because
// nothing loads them from anywhere yet. When the server exists they move into a
// single mutable object; see ARCHITECTURE-PLAN.md phase 3.
const SOLDIER_COST  = 5;
const SOLDIER_HP    = 40;
const SOLDIER_SPEED = 70;   // px/sec
const SOLDIER_DPS   = 20;
const ATTACK_RANGE  = 26;
const ENEMY_AGGRO   = 100;
const ENEMY_SPEED   = 50;
const HARVEST_RATE  = 2;    // gold/sec per unit sitting on the mine

const HEAVY_COST    = 12;   // the second unit type: slower, tougher, hits harder
const HEAVY_HP      = 120;
const HEAVY_SPEED   = 45;
const HEAVY_DPS     = 32;

const BASE_HP       = 300;

const RADIUS        = 8;
const SPACING       = 17;   // must stay below ATTACK_RANGE - 4, the enemy stop distance
const BASE_R        = 24;
const STEP          = 1 / 60;   // the simulation only ever advances by this

const MINE = { x: 160, y: 110, r: 22 };

const c = document.getElementById('c');
const g = c.getContext('2d');
const hud = document.getElementById('hud');

// ---- state -----------------------------------------------------------------
let S;

function unit(x, y, side, kind = 'soldier') {
  const heavy = kind === 'heavy';
  const max = heavy ? HEAVY_HP : SOLDIER_HP;
  return {
    x, y, side, kind, hp: max, max,
    speed: heavy ? HEAVY_SPEED : SOLDIER_SPEED,
    dps:   heavy ? HEAVY_DPS   : SOLDIER_DPS,
    dest: null, foe: null, sel: false
  };
}

// Bases are targets, not units: they never move and never join separation.
function base(x, y, side) {
  return { x, y, side, r: BASE_R, hp: BASE_HP, max: BASE_HP };
}

// xorshift32. The simulation must never call Math.random, because a replay has
// to reproduce a match exactly and Math.random cannot be seeded.
function rand() {
  let x = S.seed;
  x ^= x << 13; x >>>= 0;
  x ^= x >>> 17;
  x ^= x << 5;  x >>>= 0;
  S.seed = x;
  return x / 4294967296;
}

// Integer hash of everything the simulation owns. Positions are quantised to a
// sixteenth of a pixel so float noise below that cannot flip the result.
function checksum() {
  let h = 2166136261;
  const mix = n => { h = Math.imul(h ^ (Math.round(n * 16) | 0), 16777619) >>> 0; };
  mix(S.gold); mix(S.seed); mix(S.pbase.hp); mix(S.ebase.hp);
  for (const u of S.units)   { mix(u.x); mix(u.y); mix(u.hp); }
  for (const e of S.enemies) { mix(e.x); mix(e.y); mix(e.hp); }
  return h >>> 0;
}

function reset(seed = 1) {
  S = {
    seed: seed >>> 0 || 1,        // xorshift32 dies at zero
    gold: 0,
    status: 'playing',            // 'playing' | 'won' | 'lost'
    units: [unit(120, 330, 'p'), unit(160, 356, 'p')],
    enemies: [unit(520, 120, 'e'), unit(566, 176, 'e'), unit(500, 208, 'e')],
    pbase: base(92, 400, 'p'),
    ebase: base(566, 84, 'e'),
    drag: null                    // {x0,y0,x1,y1} while box-selecting
  };
}

// ---- helpers ---------------------------------------------------------------
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);

function moveToward(u, tx, ty, speed, dt, stopAt) {
  const dx = tx - u.x, dy = ty - u.y, d = Math.hypot(dx, dy);
  if (d <= stopAt || d < 0.5) return;
  const step = Math.min(speed * dt, d - stopAt);
  u.x += (dx / d) * step;
  u.y += (dy / d) * step;
}

function nearest(list, from) {
  let best = null, bestD = Infinity;
  for (const o of list) {
    const d = dist(o, from);
    if (d < bestD) { bestD = d; best = o; }
  }
  return best;
}

// Push overlapping bodies apart. Not physics, just enough that units stop
// occupying the same pixel. SPACING sits under the enemy stop distance so
// chasing and separating never fight each other.
function separate(all) {
  for (let i = 0; i < all.length; i++) {
    for (let j = i + 1; j < all.length; j++) {
      const a = all[i], b = all[j];
      let dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy);
      if (d >= SPACING) continue;
      if (d < 0.01) {                                   // exactly stacked: shove along a
        const ang = i * 2.39996 + j;                    // per-pair angle, so a pile
        dx = Math.cos(ang); dy = Math.sin(ang); d = 1;  // spreads into a blob, not a line
      }
      const push = (SPACING - d) / 2;
      a.x -= (dx / d) * push; a.y -= (dy / d) * push;
      b.x += (dx / d) * push; b.y += (dy / d) * push;
    }
  }
  for (const u of all) {
    u.x = Math.max(RADIUS, Math.min(c.width - RADIUS, u.x));
    u.y = Math.max(RADIUS, Math.min(c.height - RADIUS, u.y));
  }
}

// A target's radius widens its reachable band, so a 24px base is hittable from
// its edge rather than only from its centre.
const inRange  = (u, t) => dist(u, t) <= ATTACK_RANGE + (t.r || 0);
const standoff = t => ATTACK_RANGE - 4 + (t.r || 0);

// ---- update ----------------------------------------------------------------
function update(dt) {
  const hostileToPlayer = [...S.enemies, S.ebase].filter(t => t.hp > 0);

  // player units: walk to their order, auto-attack, auto-harvest
  for (const u of S.units) {
    const locked = u.foe && u.foe.hp > 0 ? u.foe : null;   // dead targets fall through
    if (locked) u.dest = { x: locked.x, y: locked.y };     // chase
    if (u.dest) moveToward(u, u.dest.x, u.dest.y, u.speed, dt, locked ? standoff(locked) : 0);

    const foe = locked || nearest(hostileToPlayer, u);
    if (foe && inRange(u, foe)) foe.hp -= u.dps * dt;

    if (dist(u, MINE) <= MINE.r + 10) S.gold += HARVEST_RATE * dt;
  }

  // enemies: fight anything that comes close, otherwise march on your base
  for (const e of S.enemies) {
    const prey = nearest(S.units, e);
    const tgt = prey && dist(prey, e) <= ENEMY_AGGRO ? prey : S.pbase;
    moveToward(e, tgt.x, tgt.y, ENEMY_SPEED, dt, standoff(tgt));
    if (inRange(e, tgt)) tgt.hp -= e.dps * dt;
  }

  separate([...S.units, ...S.enemies]);

  S.units = S.units.filter(u => u.hp > 0);
  S.enemies = S.enemies.filter(e => e.hp > 0);

  if (S.ebase.hp <= 0) S.status = 'won';
  else if (S.pbase.hp <= 0) S.status = 'lost';
  else if (!S.units.length && S.gold < SOLDIER_COST) S.status = 'lost';  // no army, no way to buy one
}

// ---- draw ------------------------------------------------------------------
function hpBar(cx, top, w, frac) {
  g.fillStyle = '#2a2d36'; g.fillRect(cx - w / 2, top, w, 3);
  g.fillStyle = '#7dd3a0'; g.fillRect(cx - w / 2, top, w * Math.max(0, frac), 3);
}

function drawUnit(u) {
  if (u.sel) {
    g.strokeStyle = '#7dd3a0';
    g.beginPath(); g.arc(u.x, u.y, 13, 0, Math.PI * 2); g.stroke();
  }
  g.fillStyle = u.side === 'p' ? '#5b8dd9' : '#d95b5b';
  if (u.kind === 'heavy') {                          // square reads as heavy at a glance
    g.fillRect(u.x - 9, u.y - 9, 18, 18);
  } else {
    g.beginPath(); g.arc(u.x, u.y, RADIUS, 0, Math.PI * 2); g.fill();
  }
  hpBar(u.x, u.y - 15, 18, u.hp / u.max);
}

function drawBase(b) {
  g.fillStyle = b.side === 'p' ? '#3f5f96' : '#8f3a3a';
  g.fillRect(b.x - b.r, b.y - b.r, b.r * 2, b.r * 2);
  hpBar(b.x, b.y - b.r - 9, b.r * 2, b.hp / b.max);
}

function draw() {
  g.clearRect(0, 0, c.width, c.height);

  g.strokeStyle = '#242832';
  for (let x = 0; x <= c.width; x += 40) { g.beginPath(); g.moveTo(x, 0); g.lineTo(x, c.height); g.stroke(); }
  for (let y = 0; y <= c.height; y += 40) { g.beginPath(); g.moveTo(0, y); g.lineTo(c.width, y); g.stroke(); }

  g.fillStyle = '#f2c14e';
  g.beginPath(); g.arc(MINE.x, MINE.y, MINE.r, 0, Math.PI * 2); g.fill();

  drawBase(S.pbase);
  drawBase(S.ebase);

  S.enemies.forEach(drawUnit);
  S.units.forEach(drawUnit);

  if (S.drag) {
    const { x0, y0, x1, y1 } = S.drag;
    g.strokeStyle = '#7dd3a0';
    g.strokeRect(Math.min(x0, x1), Math.min(y0, y1), Math.abs(x1 - x0), Math.abs(y1 - y0));
  }

  if (S.status !== 'playing') {
    g.fillStyle = 'rgba(21,22,26,.78)';
    g.fillRect(0, 0, c.width, c.height);
    g.fillStyle = S.status === 'won' ? '#7dd3a0' : '#d95b5b';
    g.font = '600 34px ui-monospace, Menlo, monospace';
    g.textAlign = 'center';
    g.fillText(S.status === 'won' ? 'VICTORY' : 'DEFEAT', c.width / 2, c.height / 2 - 6);
    g.fillStyle = '#d8d8dc';
    g.font = '13px ui-monospace, Menlo, monospace';
    g.fillText('press R to play again', c.width / 2, c.height / 2 + 24);
  }

  hud.innerHTML =
    `gold <b>${Math.floor(S.gold)}</b>` +
    `<span>units <b>${S.units.length}</b></span>` +
    `<span>your base <b>${Math.max(0, Math.ceil(S.pbase.hp))}</b></span>` +
    `<span>enemy base <b>${Math.max(0, Math.ceil(S.ebase.hp))}</b></span>`;
}

// ---- input -----------------------------------------------------------------
function pos(e) {
  const r = c.getBoundingClientRect();
  return { x: e.clientX - r.left, y: e.clientY - r.top };
}

c.addEventListener('contextmenu', e => e.preventDefault());

c.addEventListener('mousedown', e => {
  if (S.status !== 'playing') return;
  const p = pos(e);

  if (e.button === 2) {                       // right-click: order the selection
    const foe = [...S.enemies, S.ebase]
      .find(t => t.hp > 0 && Math.hypot(t.x - p.x, t.y - p.y) <= (t.r || 12)) || null;
    for (const u of S.units) if (u.sel) { u.foe = foe; u.dest = { x: p.x, y: p.y }; }
    return;
  }
  if (e.button === 0) S.drag = { x0: p.x, y0: p.y, x1: p.x, y1: p.y };
});

c.addEventListener('mousemove', e => {
  if (!S.drag) return;
  const p = pos(e);
  S.drag.x1 = p.x; S.drag.y1 = p.y;
});

window.addEventListener('mouseup', e => {
  if (e.button !== 0 || !S.drag) return;
  const { x0, y0, x1, y1 } = S.drag;
  S.drag = null;

  if (Math.hypot(x1 - x0, y1 - y0) < 5) {     // a click, not a drag
    const hit = S.units.find(u => Math.hypot(u.x - x1, u.y - y1) <= 12);
    for (const u of S.units) u.sel = (u === hit);
  } else {                                    // a box
    const lo = { x: Math.min(x0, x1), y: Math.min(y0, y1) };
    const hi = { x: Math.max(x0, x1), y: Math.max(y0, y1) };
    for (const u of S.units) u.sel = u.x >= lo.x && u.x <= hi.x && u.y >= lo.y && u.y <= hi.y;
  }
});

function buy(kind, cost) {
  if (S.status !== 'playing' || S.gold < cost) return;
  S.gold -= cost;
  const b = S.pbase;
  S.units.push(unit(b.x + b.r + 12 + rand() * 12,
                    b.y + (rand() - 0.5) * 30, 'p', kind));
}

window.addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (k === 'r') { reset(); return; }
  if (k === 's') buy('soldier', SOLDIER_COST);
  if (k === 'd') buy('heavy', HEAVY_COST);
});

// ---- game loop -------------------------------------------------------------
// Wall-clock time drives rendering. The simulation only ever advances in whole
// STEP ticks, so two machines running at different frame rates step identically.
// The 0.25s clamp stops a backgrounded tab from trying to catch up thousands of
// ticks in one frame.
let last = performance.now(), accumulator = 0;
function frame(now) {
  accumulator += Math.min(0.25, (now - last) / 1000);
  last = now;
  while (accumulator >= STEP) {
    if (S.status === 'playing') update(STEP);
    accumulator -= STEP;
  }
  draw();
  requestAnimationFrame(frame);
}

// The costs here are read from the constants rather than typed into the markup,
// so a balance change cannot leave the interface telling the player a lie.
document.getElementById('hint').innerHTML =
  'drag or click to select &middot; right-click ground to move, an enemy to focus fire<br>' +
  `<b>S</b> soldier (${SOLDIER_COST} gold) &middot; <b>D</b> heavy (${HEAVY_COST} gold) ` +
  '&middot; kill the red base to win &middot; <b>R</b> restarts';

reset();
requestAnimationFrame(frame);
</script>
</body>
</html>
