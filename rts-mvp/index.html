<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>RTS MVP</title>
<style>
  body {
    margin: 0; padding: 18px; background: #15161a; color: #d8d8dc;
    font: 13px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace;
    display: flex; flex-direction: column; align-items: center; gap: 10px;
  }
  canvas { background: #1e2129; border: 1px solid #33363f; cursor: crosshair; }
  #hud { display: flex; gap: 22px; letter-spacing: .04em; }
  #hint { opacity: .5; text-align: center; }
  b { color: #f2c14e; font-weight: 600; }
</style>
</head>
<body>

<div id="hud"></div>
<canvas id="c" width="640" height="480"></canvas>
<div id="hint"><!-- filled from the balance constants so the costs cannot drift --></div>

<script>
// ---- balance ---------------------------------------------------------------
// These are the only numbers that define difficulty. They are `const` because
// nothing loads them from anywhere yet. When the server exists they move into a
// single mutable object; see ARCHITECTURE-PLAN.md phase 3.
const SOLDIER_COST  = 5;
const SOLDIER_HP    = 40;
const SOLDIER_SPEED = 70;   // px/sec
const SOLDIER_DPS   = 20;
const ATTACK_RANGE  = 26;
const ENEMY_AGGRO   = 100;
const ENEMY_SPEED   = 50;
const HARVEST_RATE  = 2;    // gold/sec per unit sitting on the mine

const HEAVY_COST    = 12;   // the second unit type: slower, tougher, hits harder
const HEAVY_HP      = 120;
const HEAVY_SPEED   = 45;
const HEAVY_DPS     = 32;

const BASE_HP       = 300;

const RADIUS        = 8;
const SPACING       = 17;   // must stay below ATTACK_RANGE - 4, the enemy stop distance
const BASE_R        = 24;
const STEP          = 1 / 60;   // the simulation only ever advances by this

const MINE = { x: 160, y: 110, r: 22 };

const c = document.getElementById('c');
const g = c.getContext('2d');
const hud = document.getElementById('hud');

// ---- state -----------------------------------------------------------------
let S;

function unit(x, y, side, kind = 'soldier') {
  const heavy = kind === 'heavy';
  const max = heavy ? HEAVY_HP : SOLDIER_HP;
  return {
    x, y, side, kind, hp: max, max,
    speed: heavy ? HEAVY_SPEED : SOLDIER_SPEED,
    dps:   heavy ? HEAVY_DPS   : SOLDIER_DPS,
    dest: null, foe: null, sel: false
  };
}

// Bases are targets, not units: they never move and never join separation.
function base(x, y, side) {
  return { x, y, side, r: BASE_R, hp: BASE_HP, max: BASE_HP };
}

// xorshift32. The simulation must never call Math.random, because a replay has
// to reproduce a match exactly and Math.random cannot be seeded.
function rand() {
  let x = S.seed;
  x ^= x << 13; x >>>= 0;
  x ^= x >>> 17;
  x ^= x << 5;  x >>>= 0;
  S.seed = x;
  return x / 4294967296;
}

// Integer hash of everything the simulation owns. Positions are quantised to a
// sixteenth of a pixel so float noise below that cannot flip the result.
function checksum() {
  let h = 2166136261;
  const mix = n => { h = Math.imul(h ^ (Math.round(n * 16) | 0), 16777619) >>> 0; };
  mix(S.gold); mix(S.seed); mix(S.pbase.hp); mix(S.ebase.hp);
  for (const u of S.units)   { mix(u.x); mix(u.y); mix(u.hp); }
  for (const e of S.enemies) { mix(e.x); mix(e.y); mix(e.hp); }
  return h >>> 0;
}

function reset(seed = 1) {
  S = {
    seed: seed >>> 0 || 1,        // xorshift32 dies at zero
    gold: 0,
    status: 'playing',            // 'playing' | 'won' | 'lost'
    units: [unit(120, 330, 'p'), unit(160, 356, 'p')],
    enemies: [unit(520, 120, 'e'), unit(566, 176, 'e'), unit(500, 208, 'e')],
    pbase: base(92, 400, 'p'),
    ebase: base(566, 84, 'e'),
    drag: null                    // {x0,y0,x1,y1} while box-selecting
  };
}

// ---- helpers ---------------------------------------------------------------
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);

function moveToward(u, tx, ty, speed, dt, stopAt) {
  const dx = tx - u.x, dy = ty - u.y, d = Math.hypot(dx, dy);
  if (d <= stopAt || d < 0.5) return;
  const step = Math.min(speed * dt, d - stopAt);
  u.x += (dx / d) * step;
  u.y += (dy / d) * step;
}

function nearest(list, from) {
  let best = null, bestD = Infinity;
  for (const o of list) {
    const d = dist(o, from);
    if (d < bestD) { bestD = d; best = o; }
  }
  return best;
}

// Push overlapping bodies apart. Not physics, just enough that units stop
// occupying the same pixel. SPACING sits under the enemy stop distance so
// chasing and separating never fight each other.
function separate(all) {
  for (let i = 0; i < all.length; i++) {
    for (let j = i + 1; j < all.length; j++) {
      const a = all[i], b = all[j];
      let dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy);
      if (d >= SPACING) continue;
      if (d < 0.01) {                                   // exactly stacked: shove along a
        const ang = i * 2.39996 + j;                    // per-pair angle, so a pile
        dx = Math.cos(ang); dy = Math.sin(ang); d = 1;  // spreads into a blob, not a line
      }
      const push = (SPACING - d) / 2;
      a.x -= (dx / d) * push; a.y -= (dy / d) * push;
      b.x += (dx / d) * push; b.y += (dy / d) * push;
    }
  }
  for (const u of all) {
    u.x = Math.max(RADIUS, Math.min(c.width - RADIUS, u.x));
    u.y = Math.max(RADIUS, Math.min(c.height - RADIUS, u.y));
  }
}

// A target's radius widens its reachable band, so a 24px base is hittable from
// its edge rather than only from its centre.
const inRange  = (u, t) => dist(u, t) <= ATTACK_RANGE + (t.r || 0);
const standoff = t => ATTACK_RANGE - 4 + (t.r || 0);

// ---- update ----------------------------------------------------------------
function update(dt) {
  const hostileToPlayer = [...S.enemies, S.ebase].filter(t => t.hp > 0);

  // player units: walk to their order, auto-attack, auto-harvest
  for (const u of S.units) {
    const locked = u.foe && u.foe.hp > 0 ? u.foe : null;   // dead targets fall through
    if (locked) u.dest = { x: locked.x, y: locked.y };     // chase
    if (u.dest) moveToward(u, u.dest.x, u.dest.y, u.speed, dt, locked ? standoff(locked) : 0);

    const foe = locked || nearest(hostileToPlayer, u);
    if (foe && inRange(u, foe)) foe.hp -= u.dps * dt;

    if (dist(u, MINE) <= MINE.r + 10) S.gold += HARVEST_RATE * dt;
  }

  // enemies: fight anything that comes close, otherwise march on your base
  for (const e of S.enemies) {
    const prey = nearest(S.units, e);
    const tgt = prey && dist(prey, e) <= ENEMY_AGGRO ? prey : S.pbase;
    moveToward(e, tgt.x, tgt.y, ENEMY_SPEED, dt, standoff(tgt));
    if (inRange(e, tgt)) tgt.hp -= e.dps * dt;
  }

  separate([...S.units, ...S.enemies]);

  S.units = S.units.filter(u => u.hp > 0);
  S.enemies = S.enemies.filter(e => e.hp > 0);

  if (S.ebase.hp <= 0) S.status = 'won';
  else if (S.pbase.hp <= 0) S.status = 'lost';
  else if (!S.units.length && S.gold < SOLDIER_COST) S.status = 'lost';  // no army, no way to buy one
}

// ---- draw ------------------------------------------------------------------
// ---- sprites ---------------------------------------------------------------
// Client-side only. The simulation never reads any of this, and per-unit
// animation state lives in a WeakMap so simulation objects stay untouched.
const DIRS8 = ['east', 'south-east', 'south', 'south-west', 'west', 'north-west', 'north', 'north-east'];
const CARDINALS = ['north', 'east', 'south', 'west'];
const HURT_MS = 140;              // how long a unit stays red after taking damage

const sprites = { idle: {}, move: {}, attack: {}, base: {}, gold: null };

function loadImg(src) {
  const im = new Image();         // no ready flag: every draw checks the image
  im.src = src;
  return im;
}

function loadSprites() {
  for (const d of DIRS8) sprites.idle[d] = loadImg(`assets/soldier/${d}.png`);
  for (const d of CARDINALS) {
    sprites.move[d]   = [0, 1, 2, 3].map(f => loadImg(`assets/soldier/move/${d}-${f}.png`));
    sprites.attack[d] = [0, 1, 2, 3, 4].map(f => loadImg(`assets/soldier/attack/${d}-${f}.png`));
  }
  sprites.base.p = loadImg('assets/base-player.png');
  sprites.base.e = loadImg('assets/base-enemy.png');
  sprites.gold   = loadImg('assets/gold.png');
}

const usable = im => !!(im && im.complete && im.naturalWidth > 0);
const pickFrame = (arr, now, ms) => {
  if (!arr || !arr.length) return null;
  const live = arr.filter(usable);
  return live.length ? live[Math.floor(now / ms) % live.length] : null;
};

// Paints a sprite through a red wash without touching the source image. Drawn on
// a scratch canvas with source-atop so only the sprite's own pixels are tinted,
// not the transparent box around it.
const tintPad = document.createElement('canvas');
const tp = tintPad.getContext('2d');
function drawTinted(im, x, y, w, h, colour, alpha) {
  tintPad.width = w; tintPad.height = h;      // resizing resets the context state
  tp.drawImage(im, 0, 0, w, h);
  tp.globalCompositeOperation = 'source-atop';
  tp.globalAlpha = alpha;
  tp.fillStyle = colour;
  tp.fillRect(0, 0, w, h);
  g.drawImage(tintPad, x, y);
}

const facing = (dx, dy) => DIRS8[(Math.round(Math.atan2(dy, dx) / (Math.PI / 4)) + 8) % 8];
const cardinal = (dx, dy) =>
  Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'east' : 'west') : (dy > 0 ? 'south' : 'north');

// Keyed by the simulation object but stored outside it, so nothing here can be
// mistaken for state the simulation owns.
const animOf = new WeakMap();
function animFor(u, now) {
  let a = animOf.get(u);
  if (!a) {
    a = { dir: 'south', card: 'south', px: u.x, py: u.y, hp: u.hp, moving: false, hurtUntil: 0 };
    animOf.set(u, a);
  }
  const dx = u.x - a.px, dy = u.y - a.py;
  a.moving = Math.hypot(dx, dy) > 0.08;      // sub-pixel drift is not walking
  if (a.moving) { a.dir = facing(dx, dy); a.card = cardinal(dx, dy); }
  if (u.hp < a.hp - 0.01) a.hurtUntil = now + HURT_MS;
  a.px = u.x; a.py = u.y; a.hp = u.hp;
  return a;
}

// Recomputes what update() would be shooting at, purely to choose an animation.
// Rendering is allowed to read simulation state; it is never allowed to write it.
function targetInReach(u) {
  const hostiles = (u.side === 'p' ? [...S.enemies, S.ebase] : [...S.units, S.pbase])
    .filter(t => t.hp > 0);
  const locked = u.foe && u.foe.hp > 0 ? u.foe : null;
  const t = locked || nearest(hostiles, u);
  return t && inRange(u, t) ? t : null;
}

function hpBar(cx, top, w, frac) {
  g.fillStyle = '#2a2d36'; g.fillRect(cx - w / 2, top, w, 3);
  g.fillStyle = '#7dd3a0'; g.fillRect(cx - w / 2, top, w * Math.max(0, frac), 3);
}

function drawUnit(u) {
  const now = performance.now();               // wall clock, never simulation time
  const team = u.side === 'p' ? '#5b8dd9' : '#d95b5b';
  const heavy = u.kind === 'heavy';
  const a = animFor(u, now);

  // Face whatever you are hitting, so a swing does not point the wrong way.
  const tgt = targetInReach(u);
  if (tgt) { a.dir = facing(tgt.x - u.x, tgt.y - u.y); a.card = cardinal(tgt.x - u.x, tgt.y - u.y); }

  // Team-coloured disc under the feet. This is how the genre tells sides apart
  // without tinting the sprite, and it stays readable when units overlap.
  const rx = heavy ? 9 : 7;
  g.fillStyle = team;
  g.globalAlpha = 0.85;
  g.beginPath(); g.ellipse(u.x, u.y + 6, rx, rx * 0.5, 0, 0, Math.PI * 2); g.fill();
  g.globalAlpha = 1;

  if (u.sel) {
    g.strokeStyle = '#7dd3a0'; g.lineWidth = 1.5;
    g.beginPath(); g.ellipse(u.x, u.y + 6, rx + 4, (rx + 4) * 0.5, 0, 0, Math.PI * 2); g.stroke();
    g.lineWidth = 1;
  }

  // Fall back per image, not per load-batch. An onerror still counts as
  // "settled", so a global ready flag would take the sprite path, find nothing
  // usable, and draw no unit at all. Missing art must degrade to shapes, never
  // to invisible units.
  const state = tgt ? 'attack' : a.moving ? 'move' : 'idle';
  let frameImg = null;
  if (state === 'attack')    frameImg = pickFrame(sprites.attack[a.card], now, 110);
  else if (state === 'move') frameImg = pickFrame(sprites.move[a.card], now, 130);
  if (!usable(frameImg)) frameImg = sprites.idle[a.dir];     // last resort, always exists

  const hurt = now < a.hurtUntil;
  let barTop;
  if (usable(frameImg)) {
    const size = heavy ? 48 : 38;
    // The character does not fill its canvas. Measured on the source PNGs, the
    // content box is y 14..55 of 68, so the feet sit at 81% of the drawn height
    // and the head at 21%. Anchoring to the canvas bottom instead leaves the
    // unit visibly floating above its own disc.
    const top = u.y + 6 - size * (55 / 68);
    if (hurt) drawTinted(frameImg, u.x - size / 2, top, size, size, '#ff3b3b', 0.62);
    else      g.drawImage(frameImg, u.x - size / 2, top, size, size);
    barTop = top + size * (14 / 68) - 6;
  } else {
    g.fillStyle = hurt ? '#ff3b3b' : team;
    if (heavy) g.fillRect(u.x - 9, u.y - 9, 18, 18);
    else { g.beginPath(); g.arc(u.x, u.y, RADIUS, 0, Math.PI * 2); g.fill(); }
    barTop = u.y - 16;
  }

  hpBar(u.x, barTop, heavy ? 24 : 18, u.hp / u.max);
}

function drawBase(b) {
  const now = performance.now();
  let a = animOf.get(b);
  if (!a) { a = { hp: b.hp, hurtUntil: 0 }; animOf.set(b, a); }
  if (b.hp < a.hp - 0.01) a.hurtUntil = now + HURT_MS;
  a.hp = b.hp;
  const hurt = now < a.hurtUntil;

  const im = sprites.base[b.side];
  if (!usable(im)) {
    // Only in fallback. The keep sprite carries its own plot, and a second ring
    // under it reads as a stray outline rather than a footprint.
    g.strokeStyle = b.side === 'p' ? '#3f5f96' : '#8f3a3a';
    g.beginPath(); g.ellipse(b.x, b.y + b.r * 0.55, b.r, b.r * 0.42, 0, 0, Math.PI * 2); g.stroke();
  }
  if (usable(im)) {
    const size = b.r * 3.2;
    const x = b.x - size / 2, y = b.y + b.r - size * 0.86;
    if (hurt) drawTinted(im, x, y, size, size, '#ff3b3b', 0.55);
    else      g.drawImage(im, x, y, size, size);
    hpBar(b.x, y + size * 0.12, b.r * 2, b.hp / b.max);
  } else {
    g.fillStyle = hurt ? '#ff3b3b' : (b.side === 'p' ? '#3f5f96' : '#8f3a3a');
    g.fillRect(b.x - b.r, b.y - b.r, b.r * 2, b.r * 2);
    hpBar(b.x, b.y - b.r - 9, b.r * 2, b.hp / b.max);
  }
}

function draw() {
  g.clearRect(0, 0, c.width, c.height);

  g.strokeStyle = '#242832';
  for (let x = 0; x <= c.width; x += 40) { g.beginPath(); g.moveTo(x, 0); g.lineTo(x, c.height); g.stroke(); }
  for (let y = 0; y <= c.height; y += 40) { g.beginPath(); g.moveTo(0, y); g.lineTo(c.width, y); g.stroke(); }

  if (usable(sprites.gold)) {
    // Dim disc marks the harvest radius; the ore sits on top of it.
    g.fillStyle = 'rgba(242,193,78,.18)';
    g.beginPath(); g.arc(MINE.x, MINE.y, MINE.r, 0, Math.PI * 2); g.fill();
    // Measured: content box is y 5..60 of 64, so its centre is at 51% of the
    // drawn height. Anchoring on the canvas centre would sit the ore low.
    const s = MINE.r * 2.4;
    g.drawImage(sprites.gold, MINE.x - s / 2, MINE.y - s * 0.51, s, s);
  } else {
    g.fillStyle = '#f2c14e';
    g.beginPath(); g.arc(MINE.x, MINE.y, MINE.r, 0, Math.PI * 2); g.fill();
  }

  drawBase(S.pbase);
  drawBase(S.ebase);

  S.enemies.forEach(drawUnit);
  S.units.forEach(drawUnit);

  if (S.drag) {
    const { x0, y0, x1, y1 } = S.drag;
    g.strokeStyle = '#7dd3a0';
    g.strokeRect(Math.min(x0, x1), Math.min(y0, y1), Math.abs(x1 - x0), Math.abs(y1 - y0));
  }

  if (S.status !== 'playing') {
    g.fillStyle = 'rgba(21,22,26,.78)';
    g.fillRect(0, 0, c.width, c.height);
    g.fillStyle = S.status === 'won' ? '#7dd3a0' : '#d95b5b';
    g.font = '600 34px ui-monospace, Menlo, monospace';
    g.textAlign = 'center';
    g.fillText(S.status === 'won' ? 'VICTORY' : 'DEFEAT', c.width / 2, c.height / 2 - 6);
    g.fillStyle = '#d8d8dc';
    g.font = '13px ui-monospace, Menlo, monospace';
    g.fillText('press R to play again', c.width / 2, c.height / 2 + 24);
  }

  hud.innerHTML =
    `gold <b>${Math.floor(S.gold)}</b>` +
    `<span>units <b>${S.units.length}</b></span>` +
    `<span>your base <b>${Math.max(0, Math.ceil(S.pbase.hp))}</b></span>` +
    `<span>enemy base <b>${Math.max(0, Math.ceil(S.ebase.hp))}</b></span>`;
}

// ---- input -----------------------------------------------------------------
function pos(e) {
  const r = c.getBoundingClientRect();
  return { x: e.clientX - r.left, y: e.clientY - r.top };
}

c.addEventListener('contextmenu', e => e.preventDefault());

c.addEventListener('mousedown', e => {
  if (S.status !== 'playing') return;
  const p = pos(e);

  if (e.button === 2) {                       // right-click: order the selection
    const foe = [...S.enemies, S.ebase]
      .find(t => t.hp > 0 && Math.hypot(t.x - p.x, t.y - p.y) <= (t.r || 12)) || null;
    for (const u of S.units) if (u.sel) { u.foe = foe; u.dest = { x: p.x, y: p.y }; }
    return;
  }
  if (e.button === 0) S.drag = { x0: p.x, y0: p.y, x1: p.x, y1: p.y };
});

c.addEventListener('mousemove', e => {
  if (!S.drag) return;
  const p = pos(e);
  S.drag.x1 = p.x; S.drag.y1 = p.y;
});

window.addEventListener('mouseup', e => {
  if (e.button !== 0 || !S.drag) return;
  const { x0, y0, x1, y1 } = S.drag;
  S.drag = null;

  if (Math.hypot(x1 - x0, y1 - y0) < 5) {     // a click, not a drag
    const hit = S.units.find(u => Math.hypot(u.x - x1, u.y - y1) <= 12);
    for (const u of S.units) u.sel = (u === hit);
  } else {                                    // a box
    const lo = { x: Math.min(x0, x1), y: Math.min(y0, y1) };
    const hi = { x: Math.max(x0, x1), y: Math.max(y0, y1) };
    for (const u of S.units) u.sel = u.x >= lo.x && u.x <= hi.x && u.y >= lo.y && u.y <= hi.y;
  }
});

function buy(kind, cost) {
  if (S.status !== 'playing' || S.gold < cost) return;
  S.gold -= cost;
  const b = S.pbase;
  S.units.push(unit(b.x + b.r + 12 + rand() * 12,
                    b.y + (rand() - 0.5) * 30, 'p', kind));
}

window.addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (k === 'r') { reset(); return; }
  if (k === 's') buy('soldier', SOLDIER_COST);
  if (k === 'd') buy('heavy', HEAVY_COST);
});

// ---- game loop -------------------------------------------------------------
// Wall-clock time drives rendering. The simulation only ever advances in whole
// STEP ticks, so two machines running at different frame rates step identically.
// The 0.25s clamp stops a backgrounded tab from trying to catch up thousands of
// ticks in one frame.
let last = performance.now(), accumulator = 0;
function frame(now) {
  accumulator += Math.min(0.25, (now - last) / 1000);
  last = now;
  while (accumulator >= STEP) {
    if (S.status === 'playing') update(STEP);
    accumulator -= STEP;
  }
  draw();
  requestAnimationFrame(frame);
}

// The costs here are read from the constants rather than typed into the markup,
// so a balance change cannot leave the interface telling the player a lie.
document.getElementById('hint').innerHTML =
  'drag or click to select &middot; right-click ground to move, an enemy to focus fire<br>' +
  `<b>S</b> soldier (${SOLDIER_COST} gold) &middot; <b>D</b> heavy (${HEAVY_COST} gold) ` +
  '&middot; kill the red base to win &middot; <b>R</b> restarts';

loadSprites();
reset();
requestAnimationFrame(frame);
</script>
</body>
</html>
